<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">killit architecture</title><desc id="d">A command-line interface and a library API share one core. Port input is validated, then the list step finds listening sockets through a platform adapter: lsof on macOS, ss then lsof then /proc/net/tcp on Linux and containers, netstat and PowerShell on Windows, all run with spawn and argument arrays. Inspect adds owner, executable path and project type, classify assigns SAFE, WARN or BLOCKED, and kill sends SIGTERM, waits the grace period, and escalates to SIGKILL only with --force, optionally for the whole process group. Results come back as a table, JSON or exit codes.</desc>
