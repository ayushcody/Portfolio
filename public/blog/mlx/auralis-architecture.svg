<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d">
<title id="t">Auralis on MLX architecture</title><desc id="d">The FastAPI API process holds a memory guard and evicts idle models. Each MLX model runs as its own worker process in a separate MLX virtual environment, listening only on 127.0.0.1 over HTTP: Kokoro speech, Whisper large-v3-turbo recognition, Qwen3-TTS 8-bit voice cloning, a Llama 3.2 3B 4-bit language model server, and an opt-in 4-bit Indic-Speak worker. All of them share the Mac&#x27;s unified memory. If a worker fails, the API falls back to PyTorch for that request.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23231f"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f4eb"/>
<text x="60" y="50" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="15" font-weight="700" fill="#62625b">AURALIS ON APPLE SILICON · MLX WORKERS</text>
<text x="60" y="76" text-anchor="start" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="400" fill="#23231f">One API process, one MLX worker per model, one shared pool of unified memory.</text>
<rect x="66" y="136" width="300" height="130" fill="#23231f"/>
<rect x="60" y="130" width="300" height="130" fill="#f4d738" stroke="#23231f" stroke-width="3"/>
