<text x="210.0" y="208.3" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">routes · watermark · receipts</text>
<text x="210.0" y="227.3" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">retrieval (BGE-M3 + BM25)</text>
<rect x="66" y="306" width="300" height="120" fill="#23231f"/>
<rect x="60" y="300" width="300" height="120" fill="#c3b0e4" stroke="#23231f" stroke-width="3"/>
<text x="210.0" y="344.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#23231f">Memory guard</text>
<text x="210.0" y="373.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">need_mb per engine</text>
