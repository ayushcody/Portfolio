<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="t d">
<title id="t">SynergyLearn architecture</title><desc id="d">A React and Vite single-page app with a Monaco editor signs users in with Firebase Auth and calls an Express API with a bearer ID token. The API applies Helmet headers, a rate limiter and token verification through the Firebase Admin SDK, then uses Firestore for profiles, progress and caches, Gemini for content, assessments and hints with built-in fallbacks, Judge0 for sandboxed code execution, and the YouTube Data API for tutorial videos with curated fallbacks. A pre-cache worker warms popular topics on startup.</desc>
