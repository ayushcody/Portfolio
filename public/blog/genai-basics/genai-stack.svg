<title id="t">The GenAI application stack</title><desc id="d">Five layers from bottom to top: model, context, tools, orchestration, and guardrails and evals, with the user&#x27;s app on top.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23231f"/></marker></defs>
