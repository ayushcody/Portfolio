<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d">
<title id="t">Retrieval-augmented generation pipeline</title><desc id="d">Indexing: documents are split into chunks, embedded, and stored in a vector database. Query time: the question is embedded, similar chunks are retrieved, and the model answers using only those chunks, with citations.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23231f"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f4eb"/>
<text x="60" y="58" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="15" font-weight="700" fill="#62625b">RAG: RETRIEVAL-AUGMENTED GENERATION</text>
<text x="60" y="84" text-anchor="start" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="400" fill="#23231f">Look it up first, then answer from what you found.</text>
<rect x="60" y="120" width="251.99999999999997" height="28" fill="#f4d738" stroke="#23231f" stroke-width="2"/>
<text x="71" y="140" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="14" font-weight="700" fill="#23231f">1 · INDEX (ahead of time)</text>
<rect x="66" y="176" width="200" height="96" fill="#23231f"/>
<rect x="60" y="170" width="200" height="96" fill="#fffdf6" stroke="#23231f" stroke-width="3"/>
<text x="160.0" y="202.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#23231f">Docs</text>
<text x="160.0" y="231.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">PDFs · wikis</text>
<text x="160.0" y="250.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">READMEs · tickets</text>
<line x1="270" y1="218" x2="330" y2="218" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<rect x="346" y="176" width="200" height="96" fill="#23231f"/>
<rect x="340" y="170" width="200" height="96" fill="#fffdf6" stroke="#23231f" stroke-width="3"/>
<text x="440.0" y="202.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#23231f">Chunk</text>
<text x="440.0" y="231.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">split by heading</text>
<text x="440.0" y="250.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">~300–800 tokens</text>
<line x1="550" y1="218" x2="610" y2="218" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<rect x="626" y="176" width="200" height="96" fill="#23231f"/>
<rect x="620" y="170" width="200" height="96" fill="#c3b0e4" stroke="#23231f" stroke-width="3"/>
<text x="720.0" y="202.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#23231f">Embed</text>
<text x="720.0" y="231.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">text → vector</text>
<text x="720.0" y="250.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">[0.12, -0.4, …]</text>
<line x1="830" y1="218" x2="890" y2="218" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<rect x="906" y="176" width="240" height="96" fill="#23231f"/>
<rect x="900" y="170" width="240" height="96" fill="#f4d738" stroke="#23231f" stroke-width="3"/>
<text x="1020.0" y="202.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#23231f">Vector DB</text>
<text x="1020.0" y="231.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">chunks + vectors</text>
<text x="1020.0" y="250.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">+ metadata</text>
<rect x="60" y="340" width="261.2" height="28" fill="#ee8d74" stroke="#23231f" stroke-width="2"/>
<text x="71" y="360" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="14" font-weight="700" fill="#23231f">2 · QUERY (every question)</text>
<rect x="66" y="398" width="200" height="96" fill="#23231f"/>
<rect x="60" y="392" width="200" height="96" fill="#fffdf6" stroke="#23231f" stroke-width="3"/>
<text x="160.0" y="424.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#23231f">Question</text>
<text x="160.0" y="453.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">“How do I rotate</text>
<text x="160.0" y="472.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">the API key?”</text>
<line x1="270" y1="440" x2="330" y2="440" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<rect x="346" y="398" width="200" height="96" fill="#23231f"/>
<rect x="340" y="392" width="200" height="96" fill="#c3b0e4" stroke="#23231f" stroke-width="3"/>
<text x="440.0" y="424.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#23231f">Embed</text>
<text x="440.0" y="453.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">same model</text>
<text x="440.0" y="472.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">as indexing</text>
<line x1="550" y1="440" x2="610" y2="440" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<rect x="626" y="398" width="200" height="96" fill="#23231f"/>
<rect x="620" y="392" width="200" height="96" fill="#fffdf6" stroke="#23231f" stroke-width="3"/>
<text x="720.0" y="424.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#23231f">Search</text>
<text x="720.0" y="453.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">top-k similar</text>
<text x="720.0" y="472.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">chunks (+ rerank)</text>
<path d="M 1020 276 L 1020 330 L 720 330 L 720 382" fill="none" stroke="#23231f" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="7 6"/>
<text x="870" y="322" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" fill="#62625b">nearest neighbours</text>
<line x1="720" y1="498" x2="720" y2="548" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<rect x="476" y="564" width="500" height="96" fill="#23231f"/>
<rect x="470" y="558" width="500" height="96" fill="#f4d738" stroke="#23231f" stroke-width="3"/>
<text x="720.0" y="598.7" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#23231f">Prompt = question + top chunks</text>
<text x="720.0" y="628.7" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#23231f" opacity="0.82">“Answer only from these sources. Cite them.”</text>
<line x1="980" y1="606" x2="1030" y2="606" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<rect x="1046" y="546" width="120" height="132" fill="#23231f"/>
