<text x="1100.0" y="619.6" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">answer</text>
<text x="1100.0" y="638.6" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">+ citations</text>
