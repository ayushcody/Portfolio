<text x="60" y="58" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="15" font-weight="700" fill="#62625b">MCP: ONE PLUG FOR EVERY TOOL</text>
<text x="60" y="84" text-anchor="start" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="400" fill="#23231f">Wrap a tool once as a server; every MCP host can use it.</text>
