<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
<title id="t">Model Context Protocol architecture</title><desc id="d">A host application contains the model and one MCP client per server. Each client talks JSON-RPC to an MCP server over stdio or HTTP. Servers expose tools, resources and prompts, and connect to systems such as GitHub, Postgres and the file system.</desc>
