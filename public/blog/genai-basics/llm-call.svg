<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">How an LLM call works</title><desc id="d">System instructions, conversation history and retrieved context are combined into one prompt, split into tokens, and the model generates the response one token at a time until it stops.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23231f"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f4eb"/>
<text x="60" y="58" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="15" font-weight="700" fill="#62625b">ONE LLM CALL</text>
<text x="60" y="84" text-anchor="start" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="400" fill="#23231f">Everything the model knows about your task has to fit in the context window.</text>
<rect x="56" y="118" width="400" height="384" fill="none" stroke="#23231f" stroke-width="2" stroke-dasharray="8 6"/>
<text x="72" y="142" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#62625b">context window</text>
<rect x="86" y="166" width="352" height="70" fill="#23231f"/>
<rect x="80" y="160" width="352" height="70" fill="#f4d738" stroke="#23231f" stroke-width="3"/>
<text x="256.0" y="187.7" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#23231f">System prompt</text>
<text x="256.0" y="217.7" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#23231f" opacity="0.82">role · rules · output format</text>
<rect x="86" y="258" width="352" height="70" fill="#23231f"/>
<rect x="80" y="252" width="352" height="70" fill="#c3b0e4" stroke="#23231f" stroke-width="3"/>
<text x="256.0" y="279.7" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#23231f">Context</text>
<text x="256.0" y="309.7" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#23231f" opacity="0.82">docs · code · RAG results</text>
<rect x="86" y="350" width="352" height="70" fill="#23231f"/>
<rect x="80" y="344" width="352" height="70" fill="#fffdf6" stroke="#23231f" stroke-width="3"/>
<text x="256.0" y="371.7" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#23231f">Conversation</text>
<text x="256.0" y="401.7" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#23231f" opacity="0.82">history + your new message</text>
<text x="256" y="470" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="14" font-weight="400" fill="#62625b">→ split into tokens</text>
<line x1="466" y1="310" x2="556" y2="310" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<text x="511.0" y="300.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" fill="#62625b">tokens</text>
<rect x="572" y="226" width="250" height="180" fill="#23231f"/>
<rect x="566" y="220" width="250" height="180" fill="#ee8d74" stroke="#23231f" stroke-width="3"/>
<text x="691.0" y="284.5" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="30" font-weight="700" fill="#23231f">LLM</text>
<text x="691.0" y="315.5" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#23231f" opacity="0.82">predicts the</text>
<text x="691.0" y="336.5" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#23231f" opacity="0.82">most likely</text>
<text x="691.0" y="357.5" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#23231f" opacity="0.82">next token</text>
<line x1="826" y1="310" x2="916" y2="310" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<rect x="932" y="256" width="220" height="120" fill="#23231f"/>
<rect x="926" y="250" width="220" height="120" fill="#fffdf6" stroke="#23231f" stroke-width="3"/>
<text x="1036.0" y="293.3" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="21" font-weight="700" fill="#23231f">Response</text>
<text x="1036.0" y="323.3" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#23231f" opacity="0.82">streamed token</text>
<text x="1036.0" y="343.3" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#23231f" opacity="0.82">by token</text>
<path d="M 760 400 C 760 470, 622 470, 622 410" fill="none" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<text x="691" y="488" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" fill="#62625b">append &amp; repeat</text>
<text x="691" y="520" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="400" fill="#62625b">temperature = how adventurous each pick is</text>
</svg>