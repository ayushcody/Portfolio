<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">The agent loop</title><desc id="d">An agent receives a goal, then repeats: the model decides on an action, a tool runs it, and the observation is added to context. The loop ends when the goal is met or a budget is reached; risky actions pause for human approval.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23231f"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f4eb"/>
<text x="60" y="58" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="15" font-weight="700" fill="#62625b">AN AGENT IS A LOOP</text>
<text x="60" y="84" text-anchor="start" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="400" fill="#23231f">Model decides → tool acts → result goes back in → repeat, within limits.</text>
<rect x="66" y="256" width="200" height="100" fill="#23231f"/>
<rect x="60" y="250" width="200" height="100" fill="#fffdf6" stroke="#23231f" stroke-width="3"/>
<text x="160.0" y="284.6" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#23231f">Goal</text>
<text x="160.0" y="313.6" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">“Fix the failing</text>
<text x="160.0" y="332.6" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">test in auth/”</text>
<path d="M 270 300 C 320 300, 320 190, 360 190" fill="none" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<rect x="376" y="146" width="240" height="100" fill="#23231f"/>
<rect x="370" y="140" width="240" height="100" fill="#ee8d74" stroke="#23231f" stroke-width="3"/>
<text x="490.0" y="173.6" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#23231f">Think</text>
<text x="490.0" y="203.6" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#23231f" opacity="0.82">model picks the</text>
<text x="490.0" y="223.6" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#23231f" opacity="0.82">next action</text>
<rect x="706" y="256" width="240" height="100" fill="#23231f"/>
<rect x="700" y="250" width="240" height="100" fill="#f4d738" stroke="#23231f" stroke-width="3"/>
<text x="820.0" y="283.6" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#23231f">Act</text>
<text x="820.0" y="313.6" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#23231f" opacity="0.82">call a tool:</text>
<text x="820.0" y="333.6" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#23231f" opacity="0.82">read · search · run</text>
<rect x="376" y="366" width="240" height="100" fill="#23231f"/>
<rect x="370" y="360" width="240" height="100" fill="#c3b0e4" stroke="#23231f" stroke-width="3"/>
<text x="490.0" y="393.6" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#23231f">Observe</text>
<text x="490.0" y="423.6" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#23231f" opacity="0.82">tool output is added</text>
<text x="490.0" y="443.6" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#23231f" opacity="0.82">to the context</text>
<path d="M 620 190 C 690 190, 820 190, 820 240" fill="none" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<path d="M 820 360 C 820 410, 690 410, 620 410" fill="none" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<line x1="490" y1="352" x2="490" y2="250" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<text x="525" y="306" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" fill="#62625b">repeat</text>
<rect x="1006" y="146" width="160" height="96" fill="#23231f"/>
<rect x="1000" y="140" width="160" height="96" fill="#b9d3b0" stroke="#23231f" stroke-width="3"/>
<text x="1080.0" y="172.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#23231f">Done</text>
<text x="1080.0" y="201.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">goal met →</text>
<text x="1080.0" y="220.0" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">answer + diff</text>
<line x1="620" y1="170" x2="990" y2="170" stroke="#23231f" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="7 6"/>
<rect x="1006" y="366" width="160" height="110" fill="#23231f"/>
<rect x="1000" y="360" width="160" height="110" fill="#fffdf6" stroke="#23231f" stroke-width="3" stroke-dasharray="8 6"/>
<text x="1080.0" y="389.2" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#23231f">Human</text>
<text x="1080.0" y="418.2" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">approves risky</text>
<text x="1080.0" y="437.2" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">steps (send,</text>
<text x="1080.0" y="456.2" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">delete, pay)</text>
<line x1="950" y1="330" x2="990" y2="380" stroke="#23231f" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="7 6"/>
<rect x="60" y="520" width="500.4" height="28" fill="#f4d738" stroke="#23231f" stroke-width="2"/>
<text x="71" y="540" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="14" font-weight="700" fill="#23231f">LIMITS: max steps · tool allowlist · timeouts · logs</text>
</svg>