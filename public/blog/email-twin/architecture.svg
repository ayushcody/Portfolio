<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d">
<title id="t">Email Digital Twin architecture</title><desc id="d">Inside Gmail, a content script adds the Build Persona and Draft Reply buttons. A service worker handles OAuth with the gmail.readonly scope, fetches sent mail from the Gmail API and extracts plain text from MIME parts. A Node.js server sends the corpus to Gemini to build a JSON writing persona, and later sends the persona plus the thread to Gemini to produce four JSON drafts, which the content script inserts into the reply box.</desc>
