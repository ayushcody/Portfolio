<text x="60" y="540" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="400" fill="#62625b">Also released: deepseek-recipe (Rust, Python bindings) for Chat Completions, Responses and Messages API encoding.</text>
