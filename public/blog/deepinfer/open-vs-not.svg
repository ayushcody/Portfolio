<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">What DeepInfer open-sources</title><desc id="d">Open-sourced in DeepInfer: the engine and scheduler with zero-overhead asynchronous scheduling, model and sampler runtime, kernels (FlashMLA, DeepGEMM, DeepEP, TileKernels, DeepSelect, TileLang), parallelism with attention data parallelism and MoE expert parallelism with load balancing, DSpark speculative decoding, SWA bounded replay, structured outputs, and batch-invariant deterministic inference, plus deepseek-recipe for API encoding. Not included: the KV cache storage system, vision encoder, prefill and decode disaggregation wiring, and the data-parallel load balancers, which are tied to DeepSeek&#x27;s internal infrastructure.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23231f"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f4eb"/>
<text x="60" y="50" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="15" font-weight="700" fill="#62625b">WHAT YOU GET IN THE REPO</text>
<text x="60" y="76" text-anchor="start" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="400" fill="#23231f">The engine is open. The cluster plumbing around it isn&#x27;t (yet).</text>
