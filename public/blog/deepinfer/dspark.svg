<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
<title id="t">DSpark speculative decoding</title><desc id="d">A small draft model proposes 5 tokens. A confidence head estimates how likely each draft token is to be accepted. Instead of always verifying all 5, the scheduler verifies only the prefix with the best expected payoff, about 3.2 to 4.4 tokens. The big model checks them in one pass and accepts about 3.2 tokens on average, so each expensive step yields several tokens instead of one.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23231f"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f4eb"/>
<text x="60" y="50" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="15" font-weight="700" fill="#62625b">DSPARK · SPECULATIVE DECODING</text>
<text x="60" y="76" text-anchor="start" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="400" fill="#23231f">Guess several tokens cheaply, check them in one expensive pass, keep the good ones.</text>
<rect x="66" y="136" width="220" height="110" fill="#23231f"/>
<rect x="60" y="130" width="220" height="110" fill="#f4d738" stroke="#23231f" stroke-width="3"/>
<text x="170.0" y="168.7" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#23231f">1 · Draft</text>
<text x="170.0" y="197.7" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">small model proposes</text>
<text x="170.0" y="216.7" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">5 tokens</text>
<line x1="290" y1="185" x2="330" y2="185" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<rect x="346" y="136" width="240" height="110" fill="#23231f"/>
<rect x="340" y="130" width="240" height="110" fill="#c3b0e4" stroke="#23231f" stroke-width="3"/>
<text x="460.0" y="168.7" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#23231f">2 · Confidence</text>
<text x="460.0" y="197.7" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">a head predicts each</text>
<text x="460.0" y="216.7" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">token&#x27;s acceptance odds</text>
<line x1="590" y1="185" x2="630" y2="185" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<rect x="646" y="136" width="240" height="110" fill="#23231f"/>
<rect x="640" y="130" width="240" height="110" fill="#ee8d74" stroke="#23231f" stroke-width="3"/>
<text x="760.0" y="168.7" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#23231f">3 · Choose</text>
<text x="760.0" y="197.7" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">verify only the prefix</text>
<text x="760.0" y="216.7" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">worth checking</text>
<line x1="890" y1="185" x2="930" y2="185" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<rect x="946" y="136" width="200" height="110" fill="#23231f"/>
<rect x="940" y="130" width="200" height="110" fill="#b9d3b0" stroke="#23231f" stroke-width="3"/>
<text x="1040.0" y="168.7" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#23231f">4 · Verify</text>
<text x="1040.0" y="197.7" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">big model checks</text>
<text x="1040.0" y="216.7" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">all in one pass</text>
<rect x="160" y="300" width="110" height="56" fill="#b9d3b0" stroke="#23231f" stroke-width="2" />
<text x="215" y="334" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#23231f">the</text>
<text x="215" y="380" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="400" fill="#62625b">p = 0.95</text>
<rect x="290" y="300" width="110" height="56" fill="#b9d3b0" stroke="#23231f" stroke-width="2" />
<text x="345" y="334" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#23231f">cat</text>
<text x="345" y="380" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="400" fill="#62625b">p = 0.9</text>
<rect x="420" y="300" width="110" height="56" fill="#b9d3b0" stroke="#23231f" stroke-width="2" />
<text x="475" y="334" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#23231f">sat</text>
<text x="475" y="380" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="400" fill="#62625b">p = 0.8</text>
<rect x="550" y="300" width="110" height="56" fill="#efefe9" stroke="#23231f" stroke-width="2" stroke-dasharray="6 5"/>
<text x="605" y="334" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#23231f">on</text>
<text x="605" y="380" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="400" fill="#62625b">p = 0.45</text>
<rect x="680" y="300" width="110" height="56" fill="#efefe9" stroke="#23231f" stroke-width="2" stroke-dasharray="6 5"/>
<text x="735" y="334" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#23231f">a</text>
<text x="735" y="380" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="400" fill="#62625b">p = 0.2</text>
<text x="160" y="420" text-anchor="start" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#23231f">Verified: the first 3 (high confidence)</text>
<text x="550" y="420" text-anchor="start" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#23231f">Skipped: the low-confidence tail</text>
<text x="880" y="334" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#62625b">(example tokens and odds</text>
<text x="880" y="352" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#62625b">are illustrative)</text>
<text x="60" y="470" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="400" fill="#62625b">In DeepSeek&#x27;s numbers: verify 3.2–4.4 tokens instead of 5, accept ~3.2 on average, +4–7% throughput at the production point.</text>
</svg>