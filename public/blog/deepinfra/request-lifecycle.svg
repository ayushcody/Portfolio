<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">Life of one DeepInfra request</title><desc id="d">A chat completion request with a model name and optional service tier is authenticated, routed to the model&#x27;s pool, and queued by tier: priority ahead of standard, flex at lower priority, and fail_fast returns HTTP 429 at once when the model is busy. The request is batched with others on the GPU, tokens stream back, and usage is billed per input, cached input and output token.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23231f"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f4eb"/>
<text x="60" y="50" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="15" font-weight="700" fill="#62625b">LIFE OF ONE REQUEST (CONCEPTUAL)</text>
<text x="60" y="76" text-anchor="start" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="400" fill="#23231f">Simplified from DeepInfra&#x27;s public docs; their internals are not public.</text>
<rect x="66" y="146" width="200" height="150" fill="#23231f"/>
<rect x="60" y="140" width="200" height="150" fill="#f4d738" stroke="#23231f" stroke-width="3"/>
<text x="160.0" y="190.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#23231f">1 · Request</text>
<text x="160.0" y="218.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#23231f" opacity="0.82">POST /chat/completions</text>
<text x="160.0" y="236.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#23231f" opacity="0.82">model + messages</text>
<text x="160.0" y="254.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#23231f" opacity="0.82">service_tier?</text>
<line x1="265" y1="215" x2="280" y2="215" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<rect x="291" y="146" width="200" height="150" fill="#23231f"/>
<rect x="285" y="140" width="200" height="150" fill="#c3b0e4" stroke="#23231f" stroke-width="3"/>
<text x="385.0" y="199.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#23231f">2 · Auth + route</text>
<text x="385.0" y="227.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#23231f" opacity="0.82">API key → account</text>
<text x="385.0" y="245.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#23231f" opacity="0.82">model → GPU pool</text>
<line x1="490" y1="215" x2="505" y2="215" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<rect x="516" y="146" width="200" height="150" fill="#23231f"/>
<rect x="510" y="140" width="200" height="150" fill="#ee8d74" stroke="#23231f" stroke-width="3"/>
<text x="610.0" y="190.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#23231f">3 · Queue by tier</text>
<text x="610.0" y="218.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#23231f" opacity="0.82">priority (1.5x)</text>
<text x="610.0" y="236.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#23231f" opacity="0.82">standard (1x)</text>
<text x="610.0" y="254.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#23231f" opacity="0.82">flex (0.8x)</text>
<line x1="715" y1="215" x2="730" y2="215" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<rect x="741" y="146" width="200" height="150" fill="#23231f"/>
<rect x="735" y="140" width="200" height="150" fill="#b9d3b0" stroke="#23231f" stroke-width="3"/>
<text x="835.0" y="199.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#23231f">4 · Batch on GPU</text>
<text x="835.0" y="227.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#23231f" opacity="0.82">many requests share</text>
<text x="835.0" y="245.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#23231f" opacity="0.82">one forward pass</text>
<line x1="940" y1="215" x2="955" y2="215" stroke="#23231f" stroke-width="3" marker-end="url(#ah)"/>
<rect x="966" y="146" width="200" height="150" fill="#23231f"/>
<rect x="960" y="140" width="200" height="150" fill="#fffdf6" stroke="#23231f" stroke-width="3"/>
<text x="1060.0" y="199.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#23231f">5 · Stream + bill</text>
<text x="1060.0" y="227.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#23231f" opacity="0.82">tokens stream back</text>
<text x="1060.0" y="245.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#23231f" opacity="0.82">billed per token</text>
<rect x="516" y="346" width="400" height="100" fill="#23231f"/>
<rect x="510" y="340" width="400" height="100" fill="#fffdf6" stroke="#23231f" stroke-width="3" stroke-dasharray="8 6"/>
<text x="710.0" y="374.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#23231f">fail_fast: true</text>
<text x="710.0" y="402.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#23231f" opacity="0.82">model busy → HTTP 429 engine_overloaded</text>
<text x="710.0" y="420.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#23231f" opacity="0.82">immediately, nothing billed</text>
<line x1="560" y1="300" x2="640" y2="330" stroke="#23231f" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="7 6"/>
<text x="60" y="500" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="400" fill="#62625b">Prices: standard tier = base price; priority = 1.5x; flex = 0.8x (from DeepInfra&#x27;s pricing page).</text>
</svg>