<text x="460.0" y="536.1" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#23231f" opacity="0.82">A100 · H100 · H200 · B200 · B300 · NVIDIA Dynamo · fp8 / fp4 precision</text>
