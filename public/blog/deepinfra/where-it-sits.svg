<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">Where DeepInfra sits in an AI app</title><desc id="d">Your application calls an OpenAI-compatible API. DeepInfra handles authentication and billing, model routing, scheduling with service tiers, autoscaling and the inference engines, on GPUs it owns across nine data centers. Above it are your app, agent framework and prompts; below it are open-weight models from DeepSeek, Qwen, Llama, Gemma, Nemotron, Mistral, Kimi and others, plus some proprietary models.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23231f"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f4eb"/>
<text x="60" y="50" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="15" font-weight="700" fill="#62625b">WHERE DEEPINFRA SITS</text>
<text x="60" y="76" text-anchor="start" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="400" fill="#23231f">You keep the app. DeepInfra runs the model and everything under it.</text>
