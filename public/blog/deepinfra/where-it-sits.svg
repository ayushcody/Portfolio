<text x="600.0" y="277.2" text-anchor="middle" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#23231f" opacity="0.82">https://api.deepinfra.com/v1/openai · change base_url, api_key and model</text>
