<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
<title id="t">Three ways to buy DeepInfra</title><desc id="d">Serverless: shared models, pay per million tokens, no setup. Custom LLM deployments: your own model on dedicated GPUs, billed per GPU-hour by the minute, from 1.49 dollars for an A100 to 5.89 for a B300. Dedicated clusters: DGX H100, B200 and B300 clusters with 3.2 Tbps networking through sales, also offered as DeepCluster.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23231f"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f4eb"/>
<text x="60" y="50" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="15" font-weight="700" fill="#62625b">THREE WAYS TO BUY</text>
<text x="60" y="76" text-anchor="start" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="400" fill="#23231f">From pay-per-token to your own cluster.</text>
