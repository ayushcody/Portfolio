<title id="t">DeepInfra timeline</title><desc id="d">2022: founded by the team behind the imo messenger. Seed: 8 million dollars led by A.Capital and Felicis. April 2025: 18 million dollar Series A led by Felicis and Georges Harik. May 2026: 107 million dollar Series B co-led by 500 Global and Georges Harik, about 5 trillion tokens a week. July 2026: Toronto, the ninth data center and first outside the US, with over 1,000 NVIDIA B300 GPUs. September 2026: over 105 million dollars annualized revenue and 22 trillion tokens a week.</desc>
