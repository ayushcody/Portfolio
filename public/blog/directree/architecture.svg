<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Contextree (directree) architecture</title><desc id="d">A Rust CLI walks the project, drops noise through built-in, framework-specific and user ignore rules, detects the language and framework, tags each file with a role, optionally scores importance from git recency and import counts, and renders a tree, an AI-ready XML block with a token estimate, a flat list, JSON or grouped output to stdout, the clipboard or watch mode. The same binary is published to npm as per-platform packages behind a small contextree wrapper.</desc>
